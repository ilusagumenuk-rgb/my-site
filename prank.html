
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050507">
<title> </title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#050507;
}
body{
  position:relative;
  min-height:100dvh;
  font-family:Arial,sans-serif;
  isolation:isolate;
}
#fx{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:-2;pointer-events:none;
}
.ambient{
  position:fixed;left:50%;top:50%;
  width:min(100vw,600px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#8d001a 0%,#44000e 35%,transparent 70%);
  filter:blur(45px);opacity:.45;
  animation:ambient 8s ease-in-out infinite alternate;
  pointer-events:none;z-index:-1;
}
.vignette{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 10%,#02020355 70%,#000 120%);
  z-index:1;
}
.orbit{
  position:fixed;left:50%;top:50%;
  width:min(78vw,320px);aspect-ratio:1;
  border:1px solid #ff233322;border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 45px #ff002010;
  animation:orbit 24s linear infinite;
  pointer-events:none;z-index:1;
}
.orbit:before,.orbit:after{
  content:"";position:absolute;inset:17px;
  border:1px solid #ff233315;border-radius:50%;
}
.orbit:after{inset:-20px;border-color:#ff233310}
.stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:3;pointer-events:none;
}
#btn{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
  width:min(44vw,172px);
  height:min(44vw,172px);
  border-radius:50%;
  border:1px solid #ff8a8a88;
  padding:0;margin:0;
  background:
    radial-gradient(circle at 34% 24%,#ff7777 0%,#ed263b 17%,#b00020 45%,#510013 76%,#10050a 100%);
  box-shadow:
    0 0 0 7px #ff26330a,
    0 0 0 8px #ff26331a,
    0 0 45px #e0002a3d,
    0 22px 65px #000c,
    inset 0 3px 8px #ffffff55,
    inset 0 -15px 25px #000b;
  font-size:clamp(56px,17vw,78px);
  line-height:1;
  cursor:pointer;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:manipulation;
  transition:filter .2s;
}
#btn:before{
  content:"";position:absolute;inset:9px;
  border-radius:50%;border:1px solid #ffffff22;
  box-shadow:inset 0 0 22px #ff303020;
  pointer-events:none;
}
#btn:after{
  content:"";position:absolute;inset:-10px;
  border-radius:50%;border:1px solid #ff354633;
  animation:aura 3s ease-in-out infinite;
  pointer-events:none;
}
#btn:active{filter:brightness(1.3)}
#btn.playing{animation:throb .5s ease-in-out infinite alternate}
#btn.playing:after{animation:aura .5s ease-in-out infinite}
@keyframes ambient{
  from{scale:.8;opacity:.3}
  to{scale:1.2;opacity:.55}
}
@keyframes orbit{to{rotate:360deg}}
@keyframes aura{
  0%,100%{transform:scale(1);opacity:.35}
  50%{transform:scale(1.13);opacity:1}
}
@keyframes throb{
  to{filter:brightness(1.4);box-shadow:0 0 75px #f0004055,0 22px 65px #000c,inset 0 3px 8px #ffffff55,inset 0 -15px 25px #000b}
}
@media(prefers-reduced-motion:reduce){
  .ambient,.orbit,#btn,#btn:after{animation:none}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="ambient"></div>
<div class="orbit"></div>
<div class="vignette"></div>

<main class="stage">
  <button id="btn" aria-label=" " type="button">💩</button>
</main>

<script>
const canvas=document.getElementById('fx');
const ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,particles=[];
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  w=window.innerWidth;h=window.innerHeight;
  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  particles=Array.from({length:Math.min(110,Math.floor(w*h/7000))},()=>({
    x:Math.random()*w,y:Math.random()*h,
    r:Math.random()*1.5+.3,
    speed:Math.random()*.45+.08,
    alpha:Math.random()*.5+.1,
    phase:Math.random()*Math.PI*2
  }));
}
window.addEventListener('resize',resize);
resize();

let t=0;
function draw(){
  t+=.008;
  ctx.clearRect(0,0,w,h);

  const cx=w/2,cy=h/2;
  for(let i=0;i<4;i++){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(t*(i%2===0?1:-1)*(.08+i*.025));
    ctx.beginPath();
    ctx.ellipse(0,0,w*(.24+i*.115),h*(.10+i*.045),-.3,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,${22+i*7},${43+i*6},${.075-i*.013})`;
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  }

  for(const p of particles){
    p.y-=p.speed;
    p.x+=Math.sin(t*2+p.phase)*.12;
    if(p.y<-5){p.y=h+5;p.x=Math.random()*w}
    const a=p.alpha*(.55+.45*Math.sin(t*2+p.phase));
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${35+Math.floor(p.phase*4)%40},${50+Math.floor(p.phase*5)%35},${a})`;
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

const button=document.getElementById('btn');
let playing=false;

button.addEventListener('click',async()=>{
  if(playing)return;
  playing=true;
  button.classList.add('playing');

  let audio;
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)throw new Error('Audio unavailable');

    audio=new AudioContextClass();
    await audio.resume();

    const master=audio.createGain();
    master.gain.value=.72;

    const compressor=audio.createDynamicsCompressor();
    compressor.threshold.value=-20;
    compressor.knee.value=20;
    compressor.ratio.value=8;
    compressor.attack.value=.005;
    compressor.release.value=.25;
    master.connect(compressor);
    compressor.connect(audio.destination);

    const start=audio.currentTime;
    const tones=[
      [55,.28],[73.42,.34],[110,.36],[146.83,.22],[220,.1]
    ];

    for(const [frequency,volume] of tones){
      const oscillator=audio.createOscillator();
      const gain=audio.createGain();
      oscillator.type='sawtooth';
      oscillator.frequency.value=frequency;
      gain.gain.setValueAtTime(.001,start);
      gain.gain.exponentialRampToValueAtTime(volume,start+.65);
      gain.gain.setValueAtTime(volume,start+3.6);
      gain.gain.exponentialRampToValueAtTime(.001,start+4.8);
      oscillator.connect(gain);
      gain.connect(master);
      oscillator.start(start);
      oscillator.stop(start+4.85);
    }

    window.setTimeout(async()=>{
      button.classList.remove('playing');
      playing=false;
      try{await audio.close()}catch(e){}
    },5000);
  }catch(error){
    button.classList.remove('playing');
    playing=false;
    if(audio){try{await audio.close()}catch(e){}}
  }
});
</script>
</body>
</html>
